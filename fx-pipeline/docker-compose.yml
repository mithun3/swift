services:
  serv-c:
    image: fx-pipeline:latest
    container_name: fx-serv-c
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    cpuset: "${FX_SERV_C_CPUSET:-3}"
    volumes:
      - fx-queues:/tmp/fx-queues/
      - ./fx-data:/opt/fx-data
      - ./fx-telemetry:/tmp/fx-telemetry
    command: ["sh", "-c", "exec java $$JVM_OPTS -Dfx.affinity.enabled=false -Dfx.waitstrategy=phased -Dfx.telemetry.log.path=/tmp/fx-telemetry/fx-latency.hlog -cp serv-c/target/serv-c-1.0.0-SNAPSHOT.jar:serv-c/target/dependency/* com.fx.persistence.PersistenceMain"]

  telemetry:
    image: fx-pipeline:latest
    container_name: fx-telemetry
    network_mode: "host"
    volumes:
      - fx-queues:/tmp/fx-queues/
    command: ["sh", "-c", "exec java $$JVM_OPTS -Dfx.affinity.enabled=false -Dfx.waitstrategy=busyspin -cp common/target/common-1.0.0-SNAPSHOT.jar:common/target/dependency/* com.fx.common.telemetry.TelemetryMain"]
    depends_on:
      - serv-c

  serv-b:
    image: fx-pipeline:latest
    container_name: fx-serv-b
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    cpuset: "${FX_SERV_B_CPUSET:-2}"
    volumes:
      - fx-queues:/tmp/fx-queues/
      - ./fx-telemetry:/tmp/fx-telemetry
    command: ["sh", "-c", "exec java $$JVM_OPTS -Dfx.affinity.enabled=false -Dfx.waitstrategy=phased -Dfx.telemetry.log.path=/tmp/fx-telemetry/fx-latency.hlog -cp serv-b/target/serv-b-1.0.0-SNAPSHOT.jar:serv-b/target/dependency/* com.fx.pricing.PricingMain"]
    depends_on:
      - serv-c

  serv-a:
    image: fx-pipeline:latest
    container_name: fx-serv-a
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    cpuset: "${FX_SERV_A_CPUSET:-1}"
    volumes:
      - fx-queues:/tmp/fx-queues/
      - ./fx-telemetry:/tmp/fx-telemetry
    command: ["sh", "-c", "exec java $$JVM_OPTS -Dfx.affinity.enabled=false -Dfx.waitstrategy=phased -Dfx.telemetry.log.path=/tmp/fx-telemetry/fx-latency.hlog -cp serv-a/target/serv-a-1.0.0-SNAPSHOT.jar:serv-a/target/dependency/* com.fx.risk.RiskMain"]
    depends_on:
      - serv-b

  serv-0:
    image: fx-pipeline:latest
    container_name: fx-serv-0
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    cpuset: "${FX_SERV_0_CPUSET:-0}"
    volumes:
      - fx-queues:/tmp/fx-queues/
      - ./fx-telemetry:/tmp/fx-telemetry
    command: ["sh", "-c", "exec java $$JVM_OPTS -Dfx.affinity.enabled=false -Dfx.waitstrategy=phased -Dfx.telemetry.enabled=true -Dfx.telemetry.log.path=/tmp/fx-telemetry/fx-latency.hlog -Dfx.gateway.mode=tcp -cp serv-0/target/serv-0-1.0.0-SNAPSHOT.jar:serv-0/target/dependency/* com.fx.gateway.GatewayMain"]
    depends_on:
      - serv-a

  benchmark:
    image: fx-pipeline:latest
    container_name: fx-benchmark
    profiles: ["benchmark"]
    network_mode: "host"
    cpuset: "${FX_BENCHMARK_CPUSET:-4}"
    environment:
      JAVA_TOOL_OPTIONS: "-Dfx.affinity.enabled=false"
    volumes:
      - fx-queues:/tmp/fx-queues/
      - ./fx-telemetry:/tmp/fx-telemetry
    command: ["echo", "Use scripts/run_docker_benchmark.sh to run an explicit workload."]

volumes:
  fx-queues:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # mode=1777: standard sticky tmpfs permissions (world-writable with sticky bit)
      # uid=0,gid=0: owned by root inside the VM — matches container user context
      # On macOS Docker Desktop this still goes through VirtioFS; on Linux hosts
      # swap device: tmpfs for /dev/shm bind or huge=within_size for THP support.
      o: "size=8G,mode=1777,uid=0,gid=0"
